name: repro
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: my-custom-runner          # ← NOT in runnerLabels
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - run: echo "build"
  publish:
    runs-on: [self-hosted, linux, x64] # ← also not in runnerLabels
    steps:
      - uses: actions/checkout@v4
      - run: echo "publish"
