name: Test Workflow

on:
  workflow_dispatch:

jobs:
  hello_world:
    runs-on: ubuntu-latest
    container: node:18

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Hello
        shell: bash
        run: echo "HI"
